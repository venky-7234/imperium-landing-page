# ============================================================
#  Production Profile — hardened settings
# ============================================================
spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 50

  # File uploads configuration
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
      file-size-threshold: 2KB

  # SMTP placeholder (do not configure actual Gmail creds yet)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    com.imperium: WARN
    org.springframework.security: WARN
    root: ERROR
  file:
    name: /var/log/imperium/imperium-ims.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30

server:
  ssl:
    enabled: false          # Terminate SSL at load balancer

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

# Explicitly override the application.yml defaults for production
app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ORIGINS}
  whatsapp:
    account-sid: ${TWILIO_ACCOUNT_SID}
    auth-token: ${TWILIO_AUTH_TOKEN}
