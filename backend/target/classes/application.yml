# ============================================================
#  Imperium IMS — Base Application Configuration
# ============================================================
google:
  client:
    id: ${GOOGLE_CLIENT_ID:695093980409-s0eeji59eg1njq19q5c15v1oh39pgbb7.apps.googleusercontent.com}

spring:
  application:
    name: imperium-ims

  profiles:
    active: dev        # Override to 'prod' in production

  # ── DataSource ──────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/imperium_ims?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: ImperiumHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1800000

  # ── JPA / Hibernate ─────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway manages schema; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        default_batch_fetch_size: 20
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  # ── Flyway ───────────────────────────────────────────────
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    table: schema_version

  # ── Mail ─────────────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}
          ssl:
            enable: ${MAIL_SSL_ENABLE:false}
          socketFactory:
            port: ${MAIL_SOCKET_FACTORY_PORT:587}
            class: ${MAIL_SOCKET_FACTORY_CLASS:}

  # ── Jackson ──────────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

# ── Server ──────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always

# ── Actuator ────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# ── SpringDoc / Swagger ──────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  show-actuator: false

# ── Application Custom Properties ───────────────────────────
app:
  name: Imperium IMS
  version: "1.0.0-SNAPSHOT"

  # JWT
  jwt:
    secret: ${JWT_SECRET:dGhpc2lzYXZlcnlzZWNyZXRrZXlmb3Jqd3R0b2tlbnN0aGF0aXNhdGxlYXN0MjU2Yml0cw==}
    access-token-expiry-ms: ${JWT_ACCESS_EXPIRY:900000}       # 15 minutes
    refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY:604800000}  # 7 days

  # CORS
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:5174}
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    max-age: 3600

  # WhatsApp (Twilio / Meta Cloud API)
  whatsapp:
    provider: ${WHATSAPP_PROVIDER:twilio}
    account-sid: ${TWILIO_ACCOUNT_SID:ACXXXXXXXXXX}
    auth-token: ${TWILIO_AUTH_TOKEN:secret}
    from-number: ${TWILIO_FROM_NUMBER:+14155238886}

  # Notifications
  notifications:
    async-thread-pool-size: 10

  # Pagination defaults
  pagination:
    default-page-size: 20
    max-page-size: 100
